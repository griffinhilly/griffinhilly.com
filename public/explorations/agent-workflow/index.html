<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/*
  kit.css — shared base for griffinhilly.com explorations (single-file HTML pages).
  Tokens copied from griffinhilly/src/styles/global.css (Night Shift, 2026-10-12) and
  griffinhilly/public/brand/palette.css (locked 8-colour series: --s1..--s8, never cycle).
  Dark-first. Light applies under prefers-color-scheme: light or [data-theme="light"];
  [data-theme="dark"] forces dark. Fonts: Schibsted Grotesk (UI), Literata (reading),
  JetBrains Mono (labels), loaded by build.py's head snippet.
  Components: .kit-top (top bar + pills), .kit-pill, .kit-chips, .kit-search, .kit-card,
  .kit-tag, .draft-slot, .kit-ai-note, .kit-scroll (chart-only horizontal scroll), .kit-sheet.
*/

:root {
	color-scheme: dark;
	--bg: #0b0d0b;
	--surface: #111411;
	--raise: #181c18;
	--ink: #ecebe5;
	--ink2: #b9bcb3;
	--ink3: #868b82;
	--rule: #262c27;
	--accent: #7fc48a;
	--accent-strong: #a4d8ad;
	--wip: #c9963a;
	--glow: rgba(57, 139, 80, 0.2);
	--shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
	--s1: #994f20; --s2: #8b9039; --s3: #a968bc; --s4: #398b50;
	--s5: #538ae6; --s6: #c84243; --s7: #29a8a4; --s8: #a87520;
	--f-ui: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;
	--f-read: 'Literata', Georgia, serif;
	--f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
	--radius: 10px;
	--max: 880px;
}
:root[data-theme='light'] {
	color-scheme: light;
	--bg: #f4f3ee; --surface: #fbfbf8; --raise: #ffffff;
	--ink: #151915; --ink2: #454b45; --ink3: #6a7069; --rule: #dfdfd6;
	--accent: #176938; --accent-strong: #0f4f29; --wip: #8a5c0e;
	--glow: rgba(23, 105, 56, 0.1); --shadow: 0 10px 30px rgba(20, 25, 20, 0.08);
	--s1: #7e3a06; --s2: #7c8028; --s3: #76338a; --s4: #176938;
	--s5: #3065cc; --s6: #a92229; --s7: #079296; --s8: #a97416;
}
@media (prefers-color-scheme: light) {
	:root:not([data-theme='dark']) {
		color-scheme: light;
		--bg: #f4f3ee; --surface: #fbfbf8; --raise: #ffffff;
		--ink: #151915; --ink2: #454b45; --ink3: #6a7069; --rule: #dfdfd6;
		--accent: #176938; --accent-strong: #0f4f29; --wip: #8a5c0e;
		--glow: rgba(23, 105, 56, 0.1); --shadow: 0 10px 30px rgba(20, 25, 20, 0.08);
		--s1: #7e3a06; --s2: #7c8028; --s3: #76338a; --s4: #176938;
		--s5: #3065cc; --s6: #a92229; --s7: #079296; --s8: #a97416;
	}
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body {
	margin: 0;
	padding-inline: 16px;
	font: 400 16px/1.6 var(--f-ui);
	background: var(--bg);
	background-image: radial-gradient(900px 420px at 50% -140px, var(--glow), transparent 70%);
	background-repeat: no-repeat;
	color: var(--ink);
	overflow-wrap: break-word;
	-webkit-font-smoothing: antialiased;
}
main, .kit-wrap { max-width: var(--max); margin: 0 auto; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(30px, 6vw, 46px); }
h2 { font-size: clamp(22px, 3.6vw, 28px); margin-top: 64px; }
h3 { font-size: 18px; }
p { margin: 12px 0; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent-strong); }
.kit-lede { font-family: var(--f-read); font-size: 18px; color: var(--ink2); max-width: 64ch; }
.kit-prose { max-width: 66ch; color: var(--ink2); }
.kit-mono, .kit-label { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.02em; color: var(--ink3); }
.kit-label { text-transform: uppercase; letter-spacing: 0.08em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Top bar: brand link left, pill links right, then any button (theme toggle).
   On narrow screens the pill strip scrolls sideways inside its own box; it never runs under
   the button. kit.js adds .kit-fade-l / .kit-fade-r while pills are clipped on that side (soft
   edge fade), marks the current section's pill aria-current="location" and keeps it in view. */
.kit-top {
	position: sticky; top: 0; z-index: 40;
	margin: 0 -16px; padding: 10px 16px;
	display: flex; align-items: center; gap: 12px;
	background: color-mix(in srgb, var(--bg) 88%, transparent);
	backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
	border-bottom: 1px solid var(--rule);
}
.kit-top > * { flex: none; }
.kit-top .kit-brand { font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap; font-size: 15px; }
/* padding + equal negative margin: room for focus rings inside the scroll box, same layout. */
.kit-top nav {
	flex: 0 1 auto; display: flex; gap: 6px; min-width: 0;
	margin: -4px -4px -4px auto; padding: 4px;
	overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
	--fl: 0px; --fr: 0px;
}
.kit-top nav::-webkit-scrollbar { display: none; }
.kit-top nav.kit-fade-l { --fl: 28px; }
.kit-top nav.kit-fade-r { --fr: 28px; }
.kit-top nav.kit-fade-l, .kit-top nav.kit-fade-r {
	-webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
	mask-image: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
}
@media (max-width: 720px) {
	.kit-top { gap: 8px; }
	.kit-top nav { gap: 4px; }
	.kit-top nav .kit-pill { padding: 7px 10px; }
	.kit-top nav .kit-pill[aria-current] { border-color: var(--accent); background: var(--glow); }
}
.kit-pill {
	display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
	font: 500 13px/1 var(--f-ui); color: var(--ink);
	background: var(--surface); border: 1px solid var(--rule); border-radius: 999px;
	padding: 8px 12px; text-decoration: none; cursor: pointer;
}
.kit-pill:hover { border-color: var(--accent); color: var(--ink); }
.kit-pill[aria-pressed='true'] { border-color: var(--accent); background: var(--glow); }

/* Filter chips and search */
.kit-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 8px; }
.kit-chips button {
	font: 500 13px/1 var(--f-ui); color: var(--ink2); background: transparent;
	border: 1px solid var(--rule); border-radius: 999px; padding: 7px 11px; cursor: pointer;
}
.kit-chips button:hover { color: var(--ink); border-color: var(--ink3); }
.kit-chips button[aria-pressed='true'] { color: var(--ink); border-color: var(--accent); background: var(--glow); }
.kit-search, .kit-select {
	font: 400 15px/1.2 var(--f-ui); color: var(--ink); background: var(--surface);
	border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; width: 100%; max-width: 360px;
}
.kit-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kit-count { font-family: var(--f-mono); font-size: 12px; color: var(--ink3); margin: 8px 0 0; }

/* Cards */
.kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.kit-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; }
.kit-card h4 { font-size: 16px; margin-bottom: 4px; }
.kit-card p { margin: 6px 0; font-size: 14.5px; color: var(--ink2); }
.kit-card .kit-label { display: block; margin-top: 10px; }
.kit-tag { display: inline-block; font: 500 11px/1 var(--f-mono); color: var(--ink3); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 8px; }
.kit-flash { animation: kitflash 1.6s ease-out; }
@keyframes kitflash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* Horizontal scroll inside a chart only; the page itself never scrolls sideways. */
.kit-scroll { overflow-x: auto; overscroll-behavior-x: contain; max-width: 100%; }

/* Side/bottom sheet for details: bottom sheet on phones, right drawer on wide screens. */
.kit-sheet {
	position: fixed; z-index: 60; background: var(--raise); color: var(--ink);
	border: 1px solid var(--rule); box-shadow: var(--shadow);
	left: 0; right: 0; bottom: 0; max-height: 72vh; overflow-y: auto;
	border-radius: 14px 14px 0 0; padding: 18px 16px 28px;
	transform: translateY(105%); transition: transform 0.22s ease; visibility: hidden;
}
.kit-sheet.open { transform: none; visibility: visible; }
.kit-sheet .kit-close { position: sticky; top: 0; float: right; margin: -6px -4px 0 8px; }
@media (min-width: 900px) {
	.kit-sheet { left: auto; top: 0; width: 420px; max-height: none; border-radius: 0; padding: 22px 22px 40px; transform: translateX(105%); }
}


.draft-slot {
	font-family: var(--f-read); font-size: 17px; color: var(--wip);
	border: 1px dashed var(--wip); border-radius: var(--radius); padding: 14px 16px; margin: 20px 0;
	background: color-mix(in srgb, var(--wip) 8%, transparent);
}

/* Footer AI note */
.kit-ai-note {
	margin: 72px auto 40px; padding-top: 16px; border-top: 1px solid var(--rule);
	font-size: 13px; color: var(--ink3); max-width: var(--max);
}
.kit-ai-note strong { color: var(--ink2); font-weight: 500; }

@media (prefers-reduced-motion: reduce) { .kit-sheet { transition: none; } .kit-flash { animation: none; } }

/* Agent workflow draft page. Diagrams are HTML/CSS; bar charts are inline SVG drawn by page.js. */
main { padding-bottom: 24px; }
section { margin: 64px 0 0; }
.hero { margin-top: 36px; }
.hero .kit-label { margin: 0 0 10px; }
h1.title-slot { font-family: var(--f-ui); font-size: clamp(26px, 5vw, 38px); color: var(--ink); margin: 0 0 8px; letter-spacing: -0.02em; }
h2 { font-size: clamp(21px, 3.4vw, 27px); margin-bottom: 18px; }
.fig { margin: 0; }
.fig figcaption { margin-top: 14px; line-height: 1.5; }
.draft-slot { margin-top: 18px; }

/* ---------- 1. Flow diagram ---------- */
.flow { display: flex; flex-direction: column; align-items: stretch; position: relative; padding-right: 34px; }
.node {
	background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
	padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline;
}
.node .kit-label { grid-row: span 2; color: var(--ink3); }
.node strong { font-weight: 600; font-size: 15px; }
.node > span:last-child { font-size: 13.5px; color: var(--ink2); }
.node-end { border-color: var(--s5); }
.node-main { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 10%, var(--surface)); }
.node-new { border-color: var(--s4); background: color-mix(in srgb, var(--s4) 10%, var(--surface)); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tags em { font: 500 11.5px/1 var(--f-mono); font-style: normal; color: var(--ink2); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 8px; }
.edge { position: relative; min-height: 34px; display: flex; align-items: center; padding-left: 26px; }
.edge::before { content: ''; position: absolute; left: 13px; top: 2px; bottom: 8px; border-left: 1.5px solid var(--ink3); }
.edge::after { content: ''; position: absolute; left: 9px; bottom: 2px; border: 5px solid transparent; border-top: 7px solid var(--ink3); border-bottom: 0; }
.edge span { font: 400 12px/1.3 var(--f-mono); color: var(--ink3); }
.edge b { font-weight: 500; color: var(--ink2); }
.zone { border: 1.5px dashed var(--ink3); border-radius: 14px; padding: 10px 10px 12px; }
.zone-label { margin: 0 0 8px 2px; color: var(--ink2); }
.zone-flow { display: flex; flex-direction: column; }
.return {
	position: absolute; right: 0; top: 22px; bottom: 26px; width: 22px;
	border: 1.5px solid var(--s4); border-left: 0; border-radius: 0 12px 12px 0;
}
.return::before { content: ''; position: absolute; left: -2px; top: -6px; border: 5px solid transparent; border-right: 7px solid var(--s4); border-left: 0; }
.return span {
	position: absolute; right: -4px; top: 50%; transform: translate(50%, -50%) rotate(90deg); white-space: nowrap;
	font: 400 11.5px/1 var(--f-mono); color: var(--ink2); background: var(--bg); padding: 2px 6px;
}

@media (min-width: 820px) {
	.flow { flex-direction: row; align-items: center; padding-right: 0; padding-bottom: 46px; margin-bottom: 18px; }
	.flow > .node { flex: 0 0 116px; display: block; }
	.flow > .node .kit-label, .flow > .node strong, .flow > .node > span { display: block; }
	.flow > .edge { flex: 0 0 88px; min-height: 0; height: 84px; padding: 0 4px; align-items: flex-start; justify-content: center; text-align: center; }
	.flow > .edge::before { left: 4px; right: 12px; top: auto; bottom: 18px; border-left: 0; border-top: 1.5px solid var(--ink3); }
	.flow > .edge::after { left: auto; right: 4px; bottom: 13px; border: 5px solid transparent; border-left: 8px solid var(--ink3); border-right: 0; }
	.zone { flex: 1 1 auto; }
	.zone-flow { display: grid; grid-template-columns: 1fr; }
	.return { top: auto; right: auto; left: 58px; bottom: 0; width: calc(100% - 116px); height: 40px; border: 1.5px solid var(--s4); border-top: 0; border-radius: 0 0 12px 12px; }
	.return::before { left: -6px; top: -2px; border: 5px solid transparent; border-bottom: 8px solid var(--s4); border-top: 0; }
	.return span { right: auto; left: 50%; top: 100%; transform: translate(-50%, -50%); }
}

/* ---------- Charts ---------- */
.charts-2 { display: grid; gap: 14px; }
@media (min-width: 760px) { .charts-2 { grid-template-columns: 1fr 2fr; } }
.chart-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px 8px; }
.chart-card .kit-label { margin: 0 0 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.bar { fill: var(--s1); }
.bar.partial { fill: color-mix(in srgb, var(--s1) 55%, var(--surface)); stroke: var(--s1); stroke-width: 1; stroke-dasharray: 3 2; }
.bar-hit { fill: transparent; cursor: default; }
.bar-hit:hover + .bar, .hgroup:hover .bar { fill: var(--s1); filter: brightness(1.25); }
.axis text, .vlabel { font: 400 11px var(--f-mono); fill: var(--ink3); }
.vlabel.strong { fill: var(--ink2); font-weight: 500; }
.axis line, .base { stroke: var(--rule); stroke-width: 1; }
.tip {
	position: fixed; z-index: 50; pointer-events: none; background: var(--raise); color: var(--ink);
	border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px; font: 400 12.5px/1.35 var(--f-ui); box-shadow: var(--shadow);
}

/* ---------- 3. Funnel ---------- */
.funnel { display: grid; gap: 4px; }
.stage { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 10px 0; }
.stage + .stage { border-top: 1px solid var(--rule); }
.stage-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.stage-head strong { font-weight: 500; font-size: 15px; }
.stage-head .num { font: 500 18px/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.stage-sub { font-size: 13px; color: var(--ink3); }
.track { height: 14px; display: flex; gap: 2px; }
.track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--s1); }
.track i.gap { background: transparent; border: 1px dashed var(--ink3); border-radius: 4px; }
.track i.end { background: var(--s4); }
.side { display: grid; gap: 12px; margin-top: 14px; }
@media (min-width: 700px) { .side { grid-template-columns: 1fr 1fr; } }
.side-box { border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 14px; background: var(--surface); }
.side-box .kit-label { margin: 0 0 4px; }
.side-box ul { margin: 0; padding: 0; list-style: none; }
.side-box li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink2); padding: 3px 0; }
.side-box li b { font: 500 14px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- 4. Loop ---------- */
.loop { list-style: none; margin: 0; padding: 0 34px 0 0; display: grid; gap: 22px; position: relative; counter-reset: none; }
.loop li {
	position: relative; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
	padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px;
}
.loop li .kit-label { grid-row: span 2; }
.loop li strong { font-weight: 600; font-size: 15px; }
.loop li > span:last-child { font-size: 13.5px; color: var(--ink2); }
.loop li:not(:last-child)::after {
	content: ''; position: absolute; left: 22px; bottom: -19px; border: 5px solid transparent; border-top: 8px solid var(--ink3); border-bottom: 0;
}
.loop li:not(:last-child)::before { content: ''; position: absolute; left: 26px; bottom: -14px; height: 12px; border-left: 1.5px solid var(--ink3); }
.loop-target { border-color: var(--s1) !important; }
.loop-wrap { position: relative; }
.loop-back { position: absolute; right: 0; width: 24px; border: 1.5px solid var(--s1); border-left: 0; border-radius: 0 12px 12px 0; }
.loop-back::before { content: ''; position: absolute; left: -2px; top: -6px; border: 5px solid transparent; border-right: 8px solid var(--s1); border-left: 0; }
.loop-back span {
	position: absolute; right: 0; top: 50%; transform: translate(50%, -50%) rotate(90deg); white-space: nowrap;
	font: 400 11.5px/1 var(--f-mono); color: var(--ink2); background: var(--bg); padding: 2px 6px;
}
.loop-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; align-content: start; }
.loop-stats .tile { margin: 0; }
@media (min-width: 820px) {
	.loop-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: start; }
	.loop-stats { margin-top: 0; }
}

/* tiles (shared with setup) */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 12px; }
.tile b { display: block; font: 500 24px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.tile span { display: block; line-height: 1.35; margin-top: 4px; font-size: 13px; color: var(--ink2); }

/* horizontal bars (skills) */
.hbars { display: grid; gap: 8px; padding: 4px 0 8px; }
.hrow { display: grid; grid-template-columns: minmax(96px, 128px) 1fr; gap: 10px; align-items: center; }
.hrow .name { font: 400 12.5px var(--f-mono); color: var(--ink2); overflow-wrap: anywhere; }
.hrow .barwrap { display: flex; align-items: center; gap: 8px; }
.hrow .tr { flex: 1 1 auto; min-width: 0; }
.hrow .hb { display: block; height: 14px; background: var(--s1); border-radius: 0 4px 4px 0; }
.hrow .v { flex: 0 0 26px; font: 500 12.5px var(--f-mono); color: var(--ink2); font-variant-numeric: tabular-nums; }

/* Griffin's text slots stay hidden until he writes them (shipped 2026-10-15 with diagrams and captions only). */
p.draft-slot{display:none}

</style>
<title>Agent Workflow</title>
<meta name="description" content="Diagrams of a working setup with AI coding agents: sessions started from a phone, a saved-posts pipeline, a correction loop, and the size of the setup.">
<meta name="robots" content="noindex">
</head>
<body>
<header class="kit-top">
  <a class="kit-brand" href="/">Griffin Hilly</a>
  <nav aria-label="On this page">
    <a class="kit-pill" href="#phone">Phone</a>
    <a class="kit-pill" href="#timing">Timing</a>
    <a class="kit-pill" href="#pipeline">Pipeline</a>
    <a class="kit-pill" href="#loop">Corrections</a>
    <a class="kit-pill" href="#setup">Setup</a>
  </nav>
  <button class="kit-pill" type="button" id="theme-toggle">Light</button>
</header>

<main>
  <section class="hero">
    <p class="kit-label">Exploration · counts as of <span data-n="asof"></span></p>
    <!-- GRIFFIN-TITLE -->
    <h1 class="title-slot">Agent workflow</h1>
    <!-- GRIFFIN-INTRO -->
  </section>

  <section id="phone" aria-labelledby="phone-h">
    <h2 id="phone-h">Starting a new session from the phone</h2>
    <figure class="fig">
      <div class="flow" role="img" aria-label="Flow diagram: the phone talks to a relay, the relay talks to an always-on home desktop, where a standing session writes a brief, runs a spawn script, creates a fresh folder and starts a new session that shows up on the phone.">
        <div class="node node-end">
          <span class="kit-label">1</span>
          <strong>Phone</strong>
          <span>Claude app, Code tab</span>
        </div>
        <div class="edge"><span>request</span></div>
        <div class="node node-relay">
          <span class="kit-label">2</span>
          <strong>Relay</strong>
          <span>mirrors the transcript</span>
        </div>
        <div class="edge"><span>outbound connection only</span></div>
        <div class="zone">

<script>
/*
  kit.js — tiny shared helpers for griffinhilly.com explorations. No dependencies.
  Kit.esc(s)                      escape text for innerHTML
  Kit.data(id='page-data')        parse the inlined JSON block written by build.py
  Kit.theme(button)               wire a light/dark toggle (stores choice in localStorage, guarded)
  Kit.chips(el, items, value, on) render single-select filter chips; items = [{value, label}]
  Kit.sheet(el)                   open/close a .kit-sheet detail panel (Esc and close button)
  Kit.topnav(nav?)                runs automatically: top-bar pill strip edge fades + current-section pill
*/
(function () {
	const Kit = {};
	Kit.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
	Kit.data = (id = 'page-data') => JSON.parse(document.getElementById(id).textContent);

	Kit.theme = (btn) => {
		const root = document.documentElement;
		const store = (v) => { try { v ? localStorage.setItem('gh-theme', v) : localStorage.removeItem('gh-theme'); } catch (e) {} };
		let saved = null;
		try { saved = localStorage.getItem('gh-theme'); } catch (e) {}
		if (saved) root.dataset.theme = saved;
		const current = () => root.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
		const label = () => { if (btn) { btn.textContent = current() === 'dark' ? 'Light' : 'Dark'; btn.setAttribute('aria-label', 'Switch to ' + btn.textContent.toLowerCase() + ' theme'); } };
		if (btn) btn.addEventListener('click', () => { const next = current() === 'dark' ? 'light' : 'dark'; root.dataset.theme = next; store(next); label(); });
		label();
	};

	Kit.chips = (el, items, value, onChange) => {
		const render = () => {
			el.innerHTML = items.map((it) => `<button type="button" data-v="${Kit.esc(it.value)}" aria-pressed="${it.value === value}">${Kit.esc(it.label)}</button>`).join('');
		};
		el.addEventListener('click', (e) => {
			const b = e.target.closest('button[data-v]');
			if (!b) return;
			value = b.dataset.v;
			render();
			onChange(value);
		});
		render();
		return { set: (v) => { value = v; render(); } };
	};

	Kit.sheet = (el) => {
		let lastFocus = null;
		const api = {
			open(html) {
				lastFocus = document.activeElement;
				el.innerHTML = `<button type="button" class="kit-pill kit-close" aria-label="Close details">Close</button>` + html;
				el.classList.add('open');
				el.setAttribute('aria-hidden', 'false');
				el.querySelector('.kit-close').focus({ preventScroll: true });
			},
			close() {
				el.classList.remove('open');
				el.setAttribute('aria-hidden', 'true');
				if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
			},
			isOpen: () => el.classList.contains('open'),
		};
		el.setAttribute('role', 'dialog');
		el.setAttribute('aria-hidden', 'true');
		el.addEventListener('click', (e) => { if (e.target.closest('.kit-close')) api.close(); });
		document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && api.isOpen()) api.close(); });
		return api;
	};

	// Top-bar pill strip: edge fades while clipped, current-section pill marked and kept in view.
	// Runs on its own for every page (kit.js is inlined at the end of <body>).
	Kit.topnav = (nav = document.querySelector('.kit-top nav')) => {
		if (!nav) return;
		const bar = nav.closest('.kit-top');
		const still = matchMedia('(prefers-reduced-motion: reduce)');
		const links = [...nav.querySelectorAll('a[href^="#"]')]
			.map((a) => ({ a, t: document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))) }))
			.filter((x) => x.t);
		const fades = () => {
			const max = nav.scrollWidth - nav.clientWidth;
			nav.classList.toggle('kit-fade-l', max > 1 && nav.scrollLeft > 1);
			nav.classList.toggle('kit-fade-r', max > 1 && nav.scrollLeft < max - 1);
		};
		const reveal = (a) => {
			if (nav.scrollWidth - nav.clientWidth <= 1) return;
			const n = nav.getBoundingClientRect(), r = a.getBoundingClientRect(), pad = 32;
			if (r.left >= n.left + pad && r.right <= n.right - pad) return;
			const left = nav.scrollLeft + (r.left - n.left) - (nav.clientWidth - r.width) / 2;
			nav.scrollTo({ left, behavior: still.matches ? 'auto' : 'smooth' });
		};
		let current = null;
		const spy = () => {
			const line = (bar ? bar.offsetHeight : 0) + innerHeight * 0.3;
			const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 2;
			let hit = null;
			for (const x of links) if (x.t.getBoundingClientRect().top <= (atEnd ? innerHeight - 1 : line)) hit = x.a;
			if (hit === current) return;
			if (current) current.removeAttribute('aria-current');
			current = hit;
			if (hit) { hit.setAttribute('aria-current', 'location'); reveal(hit); }
		};
		let queued = false;
		const tick = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; spy(); }); } };
		nav.addEventListener('scroll', fades, { passive: true });
		addEventListener('scroll', tick, { passive: true });
		addEventListener('resize', () => { fades(); if (current) reveal(current); }, { passive: true });
		if (window.ResizeObserver) new ResizeObserver(fades).observe(nav);
		fades();
		spy();
	};

	window.Kit = Kit;
	Kit.topnav();
})();

</script>
<script>
/* Agent workflow draft page: fills numbers from page.json, draws bar charts, positions the loop bracket. */
(function () {
	const D = Kit.data();
	const S = D.spawns, P = D.pipeline, U = D.setup;
	const fmt = (n) => Number(n).toLocaleString('en-US');
	const get = (path) => path.split('.').reduce((o, k) => o && o[k], D);
	const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
	const nice = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${MON[m - 1]} ${d}, ${y}`; };

	Kit.theme(document.getElementById('theme-toggle'));
	document.querySelectorAll('[data-n]').forEach((el) => {
		const v = get(el.dataset.n);
		el.textContent = el.dataset.n === 'asof' || /since$/.test(el.dataset.n) ? nice(v) : fmt(v);
	});

	const cap = (id, txt) => { document.getElementById(id).textContent = txt; };
	cap('cap-phone', `${fmt(S.total)} sessions spawned from ${nice(S.first)} to ${nice(S.last)}: ${S.pads} in fresh folders, ${S.project_folders} in project folders. Up to 32 sessions per desktop connection.`);
	cap('cap-timing', `${S.total} spawns on ${S.active_days} days. Busiest day: ${S.busiest_day_n}. Most in one minute: ${S.max_same_minute}. October counts run to ${nice(S.last)}.`);
	cap('cap-pipeline', `${fmt(P.saves)} saves; ${fmt(P.filings)} filings into ${P.threads} threads; ${P.ideas} ideas across ${P.reports} reports.`);
	cap('cap-loop', `${P.ledger_rows} saves reviewed; ${P.reviewed_filings} agent filings checked, ${P.wrong_filings} marked wrong, ${P.added_filings} threads added in review.`);
	cap('cap-setup', `${U.skill_calls} skill calls of ${U.skills_used} distinct skills logged since ${nice(U.log_since)}.`);

	/* ---------- tooltip ---------- */
	const tip = document.getElementById('tip');
	const showTip = (e, html) => {
		tip.innerHTML = html; tip.hidden = false;
		const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
		tip.style.left = x + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 10) + 'px';
	};
	const hideTip = () => { tip.hidden = true; };

	/* ---------- vertical bar chart (inline SVG at real pixel width) ---------- */
	const NS = 'http://www.w3.org/2000/svg';
	const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
	function bars(el, items, opts) {
		const W = Math.max(240, el.clientWidth), H = opts.height || 170;
		const m = { t: 18, r: 4, b: 22, l: 4 };
		const iw = W - m.l - m.r, ih = H - m.t - m.b;
		const max = Math.max(...items.map((d) => d.n));
		const step = iw / items.length, gap = Math.max(2, Math.min(step * 0.28, 18)), bw = step - gap;
		el.innerHTML = '';
		const svg = mk('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.label }, el);
		mk('line', { class: 'base', x1: m.l, x2: W - m.r, y1: m.t + ih + 0.5, y2: m.t + ih + 0.5 }, svg);
		items.forEach((d, i) => {
			const x = m.l + i * step + gap / 2, h = max ? (d.n / max) * ih : 0, y = m.t + ih - h;
			const g = mk('g', { class: 'hgroup' }, svg);
			if (d.n > 0) {
				const r = Math.min(4, bw / 2, h);
				mk('path', { class: 'bar' + (d.partial ? ' partial' : ''), d: `M${x},${m.t + ih}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${m.t + ih}Z` }, g);
			}
			mk('rect', { class: 'bar-hit', x: m.l + i * step, y: m.t, width: step, height: ih + m.b }, g);
			if (opts.valueLabel(d)) {
				const t = mk('text', { class: 'vlabel strong', x: x + bw / 2, y: y - 5, 'text-anchor': 'middle' }, g);
				t.textContent = d.n;
			}
			if (d.tick) {
				const t = mk('text', { class: 'vlabel', x: x + bw / 2, y: H - 6, 'text-anchor': 'middle' }, g);
				t.textContent = d.tick;
			}
			g.addEventListener('pointermove', (e) => showTip(e, d.tip));
			g.addEventListener('pointerleave', hideTip);
		});
	}

	const monthItems = S.by_month.map((d) => {
		const m = MON[Number(d.month.slice(5)) - 1];
		return { n: d.n, partial: d.partial, tick: d.partial ? `${m} (to ${Number(S.last.slice(8))}th)` : m,
			tip: `<b>${m} ${d.month.slice(0, 4)}</b><br>${d.n} sessions spawned${d.partial ? ` (to ${nice(S.last)})` : ''}` };
	});
	const peak = Math.max(...S.by_hour);
	const hourItems = S.by_hour.map((n, h) => ({
		n, tick: h % 3 === 0 ? String(h).padStart(2, '0') : '',
		tip: `<b>${String(h).padStart(2, '0')}:00–${String(h).padStart(2, '0')}:59</b><br>${n} session${n === 1 ? '' : 's'} spawned`,
		hi: n >= peak - 2 && n > 0,
	}));
	const drawCharts = () => {
		bars(document.getElementById('chart-month'), monthItems, { label: 'Sessions spawned by month', valueLabel: () => true });
		bars(document.getElementById('chart-hour'), hourItems, { label: 'Sessions spawned by hour of day', valueLabel: (d) => d.hi });
	};

	/* ---------- funnel ---------- */
	const pct = (n) => (100 * n / P.saves).toFixed(2) + '%';
	const stages = [
		{ t: 'Saved for later', n: P.saves, sub: `${fmt(P.bookmarks)} posts + ${P.tabs} browser tabs`, track: [[P.saves]] },
		{ t: 'Tagged with topics', n: P.bookmarks_tagged + P.tabs_tagged, sub: `${P.topics} topics`, track: [[P.bookmarks_tagged + P.tabs_tagged]] },
		{ t: 'Filed into at least one project thread', n: P.filed, sub: `${P.threads} threads · ${fmt(P.unfiled)} not filed (dashed)`, track: [[P.filed], [P.unfiled, 'gap']] },
		{ t: 'Matched to a planned article in a writing project', n: P.saves_in_stubs, sub: `${fmt(P.stub_matches)} matches across ${P.stubs_hit} of ${P.writing_stubs} planned articles, ${P.writing_sections} sections`, track: [[P.saves_in_stubs]] },
		{ t: 'Ideas written from the saves', n: P.ideas, sub: `${P.reports} reports sent to the phone`, track: null },
	];
	document.getElementById('funnel').innerHTML = stages.map((s) => `
		<div class="stage">
			<div class="stage-head"><strong>${Kit.esc(s.t)}</strong><span class="num">${fmt(s.n)}</span></div>
			<div class="stage-sub">${Kit.esc(s.sub)}</div>
			${s.track ? `<div class="track" aria-hidden="true">${s.track.map(([n, c]) => `<i class="${c || ''}" style="width:calc(${pct(n)} - 1px)"></i>`).join('')}</div>` : ''}
		</div>`).join('');
	const li = (rows) => rows.map(([k, v]) => `<li><span>${Kit.esc(k)}</span><b>${fmt(v)}</b></li>`).join('');
	document.getElementById('enrich').innerHTML = li([['Image descriptions', P.image_descriptions], ['Linked article texts', P.article_texts], ['Browser-tab page texts', P.tab_texts]]);
	document.getElementById('search').innerHTML = li([['Liked posts', P.likes], ['Saved posts', P.bookmarks], ['Own posts', P.own_posts], ['Browser tabs', P.tabs]]);

	/* ---------- tiles ---------- */
	const tiles = (id, rows) => { document.getElementById(id).innerHTML = rows.map(([v, k]) => `<div class="tile"><b>${v}</b><span>${Kit.esc(k)}</span></div>`).join(''); };
	const kept = (100 * (P.reviewed_filings - P.wrong_filings) / P.reviewed_filings).toFixed(1) + '%';
	tiles('loop-stats', [[fmt(P.ledger_rows), 'saves reviewed on the phone'], [fmt(P.reviewed_filings), 'agent filings checked'], [kept, 'of checked filings kept'], [fmt(P.added_filings), 'threads added in review']]);
	tiles('tiles', [[U.skills, 'skills'], [U.commands, 'commands'], [U.hooks, 'hooks'], [U.guides, 'guides'],
		[U.tools, 'tool scripts'], [U.subagents, 'subagent definitions'], [U.memory_files, 'memory files'], [U.claude_md_lines, 'lines of global instructions']]);

	/* ---------- skills bars ---------- */
	const smax = Math.max(...U.top_skills.map((d) => d.n));
	document.getElementById('chart-skills').innerHTML = U.top_skills.map((d) => `
		<div class="hrow"><span class="name">${Kit.esc(d.name)}</span>
		<span class="barwrap"><span class="tr"><i class="hb" style="width:${(100 * d.n / smax).toFixed(1)}%"></i></span><span class="v">${d.n}</span></span></div>`).join('');

	/* ---------- loop bracket: from step 6 back to step 3 ---------- */
	const placeLoop = () => {
		const wrap = document.querySelector('.loop-wrap'), items = wrap.querySelectorAll('.loop li'), back = wrap.querySelector('.loop-back');
		const wr = wrap.getBoundingClientRect();
		const mid = (el) => { const r = el.getBoundingClientRect(); return r.top - wr.top + r.height / 2; };
		const top = mid(items[2]), bot = mid(items[5]);
		back.style.top = top + 'px'; back.style.height = (bot - top) + 'px';
	};

	const all = () => { drawCharts(); placeLoop(); };
	all();
	let raf; window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(all); });
	if (document.fonts && document.fonts.ready) document.fonts.ready.then(all);
})();

</script>
