  #root{--bg:#0a0b0f;--card:#0f1117;--ink:#ece9e1;--muted:#8a8d99;
    --amber:#ffcf70;--amber2:#f5a623;--line:#242836;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    padding:0;-webkit-font-smoothing:antialiased;}
  #wrap{margin:0;position:relative;overflow:hidden;
    background:radial-gradient(120% 90% at 50% -20%,#171b28 0%,var(--card) 58%,#0b0d13 100%);
    padding:18px 26px 12px;}
  header{display:grid;grid-template-columns:1fr minmax(0,468px);align-items:end;
    gap:6px 46px;margin:0 6px 30px;}
  .eyebrow{grid-column:1/-1;font-size:12px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--amber);margin:0;font-weight:600;}
  h1{margin:0;font-size:clamp(34px,5vw,62px);font-weight:800;letter-spacing:-.02em;
    line-height:.98;text-wrap:balance;}
  .dek{margin:0 0 6px;font-size:15px;color:#c3c6d0;}
  .dek b{color:var(--amber);font-weight:700;} .dek i{color:#e8e6e0;}
  #stage{position:relative;}
  #map{width:100%;height:auto;display:block;}
  #states{fill:none;stroke:#ffffff22;stroke-width:.7;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;pointer-events:none;}
  .terr{stroke:#0a0b0f;stroke-width:1;stroke-linejoin:round;opacity:.9;
    transition:opacity .12s,filter .12s;cursor:pointer;}
  .terr.hot{opacity:1;filter:brightness(1.26) saturate(1.08);}
  .terr.dim{opacity:.34;}
  /* labels */
  #labels,#socal{pointer-events:none;}
  .dot{fill:var(--amber);stroke:#3a2a05;stroke-width:1;}
  .sdot{fill:#caa24d;opacity:.55;}
  .mlab{fill:#fff;font:700 15.5px var(--sans);paint-order:stroke;
    stroke:#0a0b0f;stroke-width:3.4px;stroke-linejoin:round;}
  .clab{fill:#dcdfe8;font:600 14px var(--sans);paint-order:stroke;stroke:#0a0b0f;stroke-width:3px;}
  .ldr{stroke:#9498a6;stroke-width:1;fill:none;vector-effect:non-scaling-stroke;}
  .lab.hot .mlab,.lab.hot .clab{fill:var(--amber);}
  .lab.hot .dot{fill:#fff;}
  /* inset */
  .loc{fill:#ffffff10;stroke:var(--amber);stroke-width:1.4;stroke-dasharray:4 3;
    vector-effect:non-scaling-stroke;pointer-events:none;}
  .lead{stroke:var(--amber);stroke-width:1;stroke-dasharray:4 3;opacity:.55;
    vector-effect:non-scaling-stroke;pointer-events:none;}
  .ipanel{fill:#080a10;stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 10px 22px #000a);}
  .icoast{fill:none;stroke:#ffffff2a;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none;}
  .ititle{fill:var(--muted);font:600 11.5px var(--sans);letter-spacing:.13em;pointer-events:none;}
  .ilab{fill:#fff;font:700 12px var(--sans);paint-order:stroke;stroke:#080a10;stroke-width:3px;}
  @media (prefers-reduced-motion:reduce){.terr{transition:none;}}
</style>
<script>
(function(){
  var root=document.getElementById("root");
  var terr=[].slice.call(root.querySelectorAll(".terr"));
  var labs=[].slice.call(root.querySelectorAll(".lab"));
  function set(id,on){
    terr.forEach(function(p){var m=p.getAttribute("data-id")==id;
      p.classList.toggle("hot",m&&on); p.classList.toggle("dim",on&&!m);});
    labs.forEach(function(l){if(l.getAttribute("data-id")==id) l.classList.toggle("hot",on);});
  }
  terr.forEach(function(p){var id=p.getAttribute("data-id");
    p.addEventListener("mouseenter",function(){set(id,true);});
    p.addEventListener("mouseleave",function(){set(id,false);});});
})();
</script>
</div>

</body>
